<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f2a3d">
<title>Lynko — Le lien professionnel, en un scan.</title>
<style>
:root{--bg:#0f2a3d;--bg2:#163a52;--card:#ffffff;--ink:#12212c;--mut:#5d7080;--acc:#19c3a6;--acc2:#0e9f87;--line:#e3eaf0;--danger:#d64545}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:#eaf3f8;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
body{min-height:100vh;padding-bottom:calc(76px + env(safe-area-inset-bottom))}
header{padding:calc(14px + env(safe-area-inset-top)) 18px 10px}
header h1{margin:0;font-size:26px;letter-spacing:.5px}
header h1 span{color:var(--acc)}
header p{margin:2px 0 0;color:#9fb8c8;font-size:13px}
main{padding:0 14px 20px;max-width:640px;margin:0 auto}
section{display:none}
section.on{display:block}
.panel{background:var(--bg2);border-radius:16px;padding:16px;margin-bottom:14px}
.panel h2{margin:0 0 12px;font-size:17px}
label{display:block;font-size:12px;color:#9fb8c8;margin:10px 0 4px}
input,textarea,select{width:100%;padding:12px;border-radius:10px;border:1px solid #2b536f;background:#0f2a3d;color:#fff;font-size:16px;font-family:inherit}
textarea{min-height:90px;resize:vertical}
input:focus,textarea:focus,select:focus{outline:2px solid var(--acc);border-color:transparent}
button{font-family:inherit;font-size:15px;font-weight:600;border:0;border-radius:10px;padding:12px 14px;background:var(--acc);color:#04251f;cursor:pointer}
button.sec{background:#24506b;color:#eaf3f8}
button.dng{background:var(--danger);color:#fff}
button:active{transform:scale(.98)}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.row>button{flex:1 1 130px}
.vcard{background:var(--card);color:var(--ink);border-radius:18px;padding:18px;display:flex;flex-direction:column;align-items:center;gap:10px;box-shadow:0 10px 30px rgba(0,0,0,.3)}
.vcard .nm{font-size:22px;font-weight:700;text-align:center}
.vcard .tt{color:var(--mut);font-size:14px;text-align:center}
.vcard .ln{font-size:13px;color:var(--ink);text-align:center;word-break:break-word}
.vcard canvas{width:220px;height:220px;image-rendering:pixelated;border:1px solid var(--line);border-radius:8px}
.vcard .brand{font-size:11px;color:var(--acc2);letter-spacing:1px}
.ct{background:var(--card);color:var(--ink);border-radius:12px;padding:12px;margin-bottom:8px}
.ct b{font-size:16px}
.ct small{display:block;color:var(--mut);margin-top:2px;word-break:break-word}
.ct .acts{display:flex;gap:6px;margin-top:8px}
.ct .acts button{padding:8px 10px;font-size:13px}
.hist{font-size:13px;color:#cfe0ea;padding:6px 0;border-bottom:1px solid #24506b}
.hist:last-child{border:0}
.msg{font-size:13px;color:#9fb8c8;margin:8px 0 0}
.ok{color:var(--acc)}
nav{position:fixed;left:0;right:0;bottom:0;background:#0b2030;display:flex;border-top:1px solid #24506b;padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;background:none;color:#8fa9ba;border-radius:0;padding:12px 4px 10px;font-size:12px}
nav button .ic{display:block;font-size:20px;margin-bottom:2px}
nav button.on{color:var(--acc)}
video{width:100%;border-radius:12px;background:#000;margin-top:10px}
.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#eaf3f8;color:#0f2a3d;padding:10px 16px;border-radius:20px;font-size:14px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .25s;z-index:9}
.toast.show{opacity:1}
</style>
</head>
<body>
<header>
  <h1>Lyn<span>ko</span></h1>
  <p data-i="slogan"></p>
</header>
<main>

<!-- MA CARTE -->
<section id="s-card" class="on">
  <div class="panel">
    <h2 data-i="myCard"></h2>
    <div class="vcard" id="preview">
      <div class="nm" id="pvName"></div>
      <div class="tt" id="pvTitle"></div>
      <div class="ln" id="pvLines"></div>
      <canvas id="qr" width="220" height="220"></canvas>
      <div class="brand">LYNKO</div>
    </div>
    <div class="row">
      <button onclick="downloadQR()" data-i="dlQR"></button>
      <button class="sec" onclick="downloadVcf()" data-i="dlVcf"></button>
      <button class="sec" onclick="shareCard()" data-i="share"></button>
    </div>
  </div>
  <div class="panel">
    <h2 data-i="profile"></h2>
    <label data-i="fName"></label><input id="f_name" autocomplete="name">
    <label data-i="fTitle"></label><input id="f_title">
    <label data-i="fOrg"></label><input id="f_org">
    <label data-i="fPhone"></label><input id="f_phone" type="tel" inputmode="tel">
    <label data-i="fEmail"></label><input id="f_email" type="email" inputmode="email">
    <label data-i="fWeb"></label><input id="f_web" inputmode="url" placeholder="https://">
    <label data-i="fCity"></label><input id="f_city">
    <div class="row"><button onclick="saveProfile()" data-i="save"></button></div>
  </div>
</section>

<!-- RESEAU -->
<section id="s-net">
  <div class="panel">
    <h2 data-i="addContact"></h2>
    <label data-i="pasteLbl"></label>
    <textarea id="paste" placeholder="BEGIN:VCARD&#10;FN:..."></textarea>
    <div class="row">
      <button onclick="importPaste()" data-i="importBtn"></button>
      <button class="sec" onclick="scanStart()" data-i="scanBtn"></button>
    </div>
    <video id="vid" playsinline muted style="display:none"></video>
    <p class="msg" id="scanMsg"></p>
    <hr style="border:0;border-top:1px solid #24506b;margin:14px 0">
    <label data-i="fName"></label><input id="c_name">
    <label data-i="fOrg"></label><input id="c_org">
    <label data-i="fPhone"></label><input id="c_phone" type="tel" inputmode="tel">
    <label data-i="fEmail"></label><input id="c_email" type="email" inputmode="email">
    <label data-i="note"></label><input id="c_note">
    <div class="row"><button onclick="addManual()" data-i="addBtn"></button></div>
  </div>
  <div class="panel">
    <h2><span data-i="contacts"></span> (<span id="cnt">0</span>)</h2>
    <input id="search" data-ip="search" oninput="renderContacts()">
    <div id="list" style="margin-top:10px"></div>
  </div>
</section>

<!-- HISTORIQUE -->
<section id="s-hist">
  <div class="panel">
    <h2 data-i="history"></h2>
    <div id="histList"></div>
  </div>
</section>

<!-- REGLAGES -->
<section id="s-set">
  <div class="panel">
    <h2 data-i="settings"></h2>
    <label data-i="lang"></label>
    <select id="lang" onchange="setLang(this.value)">
      <option value="fr">Français</option>
      <option value="en">English</option>
    </select>
  </div>
  <div class="panel">
    <h2 data-i="backup"></h2>
    <div class="row">
      <button onclick="exportJSON()" data-i="exportJson"></button>
      <button class="sec" onclick="exportAllVcf()" data-i="exportVcf"></button>
    </div>
    <label data-i="restore"></label>
    <input type="file" id="file" accept=".json,application/json" onchange="importJSON(this)">
    <div class="row"><button class="dng" onclick="wipe()" data-i="wipe"></button></div>
    <p class="msg" data-i="offlineNote"></p>
  </div>
</section>

</main>

<nav>
  <button class="on" data-t="card" onclick="tab('card')"><span class="ic">🪪</span><span data-i="tCard"></span></button>
  <button data-t="net" onclick="tab('net')"><span class="ic">👥</span><span data-i="tNet"></span></button>
  <button data-t="hist" onclick="tab('hist')"><span class="ic">🕘</span><span data-i="tHist"></span></button>
  <button data-t="set" onclick="tab('set')"><span class="ic">⚙️</span><span data-i="tSet"></span></button>
</nav>
<div class="toast" id="toast"></div>

<script>
/* ============ QR CODE (encodeur autonome, mode octets, correction M) ============ */
const QR = (function(){
  const ECC_PER_BLOCK=[-1,10,16,26,18,24,16,18,22,22,26,30,22,22,24,24,28,28,26,26,26,26,28,28,28,28,28,28,28,28,28,28,28,28,28,28,28,28,28,28,28];
  const NUM_BLOCKS=[-1,1,1,1,2,2,4,4,4,5,5,5,8,9,9,10,10,11,13,14,16,17,17,18,20,21,23,25,26,28,29,31,33,35,37,38,40,43,45,47,49];
  function rawModules(v){let r=(16*v+128)*v+64;if(v>=2){const n=Math.floor(v/7)+2;r-=(25*n-10)*n-55;if(v>=7)r-=36}return r}
  function dataCodewords(v){return Math.floor(rawModules(v)/8)-ECC_PER_BLOCK[v]*NUM_BLOCKS[v]}
  function mul(x,y){let z=0;for(let i=7;i>=0;i--){z=(z<<1)^((z>>>7)*0x11D);z^=((y>>>i)&1)*x}return z}
  function rsDiv(d){const r=new Array(d).fill(0);r[d-1]=1;let root=1;for(let i=0;i<d;i++){for(let j=0;j<d;j++){r[j]=mul(r[j],root);if(j+1<d)r[j]^=r[j+1]}root=mul(root,2)}return r}
  function rsRem(data,div){const r=div.map(()=>0);for(const b of data){const f=b^r.shift();r.push(0);div.forEach((c,i)=>r[i]^=mul(c,f))}return r}
  function utf8(s){return Array.from(new TextEncoder().encode(s))}
  function encode(text){
    const bytes=utf8(text);let ver=1;
    for(;;ver++){
      if(ver>40)throw new Error("Texte trop long pour le QR");
      const cc=ver<10?8:16;
      if(4+cc+bytes.length*8<=dataCodewords(ver)*8)break;
    }
    const cc=ver<10?8:16,bits=[];
    const put=(v,n)=>{for(let i=n-1;i>=0;i--)bits.push((v>>>i)&1)};
    put(4,4);put(bytes.length,cc);bytes.forEach(b=>put(b,8));
    const cap=dataCodewords(ver)*8;
    put(0,Math.min(4,cap-bits.length));
    while(bits.length%8)bits.push(0);
    for(let p=0xEC;bits.length<cap;p^=0xEC^0x11)put(p,8);
    const data=[];for(let i=0;i<bits.length;i+=8){let b=0;for(let j=0;j<8;j++)b=(b<<1)|bits[i+j];data.push(b)}
    // blocs + ECC
    const nb=NUM_BLOCKS[ver],el=ECC_PER_BLOCK[ver],raw=Math.floor(rawModules(ver)/8);
    const ns=nb-raw%nb,sl=Math.floor(raw/nb),div=rsDiv(el),blocks=[];
    for(let i=0,k=0;i<nb;i++){
      const len=sl-el+(i<ns?0:1);
      const dat=data.slice(k,k+len);k+=len;
      const ecc=rsRem(dat,div);
      if(i<ns)dat.push(0);
      blocks.push(dat.concat(ecc));
    }
    const all=[];
    for(let i=0;i<blocks[0].length;i++)blocks.forEach((b,j)=>{if(i!=sl-el||j>=ns)all.push(b[i])});
    // matrice
    const size=ver*4+17;
    const m=[],fn=[];
    for(let i=0;i<size;i++){m.push(new Array(size).fill(false));fn.push(new Array(size).fill(false))}
    const set=(x,y,d)=>{m[y][x]=d;fn[y][x]=true};
    for(let i=0;i<size;i++){set(6,i,i%2==0);set(i,6,i%2==0)}
    const finder=(x,y)=>{for(let dy=-4;dy<=4;dy++)for(let dx=-4;dx<=4;dx++){const d=Math.max(Math.abs(dx),Math.abs(dy)),xx=x+dx,yy=y+dy;if(xx>=0&&xx<size&&yy>=0&&yy<size)set(xx,yy,d!=2&&d!=4)}};
    finder(3,3);finder(size-4,3);finder(3,size-4);
    let ap=[];
    if(ver>1){const n=Math.floor(ver/7)+2,step=ver==32?26:Math.ceil((ver*4+4)/(n*2-2))*2;ap=[6];for(let p=size-7;ap.length<n;p-=step)ap.splice(1,0,p)}
    for(let i=0;i<ap.length;i++)for(let j=0;j<ap.length;j++){
      if((i==0&&j==0)||(i==0&&j==ap.length-1)||(i==ap.length-1&&j==0))continue;
      for(let dy=-2;dy<=2;dy++)for(let dx=-2;dx<=2;dx++)set(ap[i]+dx,ap[j]+dy,Math.max(Math.abs(dx),Math.abs(dy))!=1);
    }
    const fmt=mask=>{
      const d=(0<<3)|mask;let r=d;for(let i=0;i<10;i++)r=(r<<1)^((r>>>9)*0x537);
      const b=((d<<10)|r)^0x5412,g=i=>((b>>>i)&1)!=0;
      for(let i=0;i<=5;i++)set(8,i,g(i));set(8,7,g(6));set(8,8,g(7));set(7,8,g(8));
      for(let i=9;i<15;i++)set(14-i,8,g(i));
      for(let i=0;i<8;i++)set(size-1-i,8,g(i));
      for(let i=8;i<15;i++)set(8,size-15+i,g(i));
      set(8,size-8,true);
    };
    fmt(0);
    if(ver>=7){let r=ver;for(let i=0;i<12;i++)r=(r<<1)^((r>>>11)*0x1F25);const b=(ver<<12)|r;
      for(let i=0;i<18;i++){const c=((b>>>i)&1)!=0,a=size-11+i%3,bb=Math.floor(i/3);set(a,bb,c);set(bb,a,c)}}
    // données
    let i=0;
    for(let right=size-1;right>=1;right-=2){
      if(right==6)right=5;
      for(let vert=0;vert<size;vert++)for(let j=0;j<2;j++){
        const x=right-j,up=((right+1)&2)==0,y=up?size-1-vert:vert;
        if(!fn[y][x]&&i<all.length*8){m[y][x]=((all[i>>>3]>>>(7-(i&7)))&1)!=0;i++}
      }
    }
    // masque
    const cond=[(x,y)=>(x+y)%2==0,(x,y)=>y%2==0,(x,y)=>x%3==0,(x,y)=>(x+y)%3==0,(x,y)=>(Math.floor(x/3)+Math.floor(y/2))%2==0,(x,y)=>x*y%2+x*y%3==0,(x,y)=>(x*y%2+x*y%3)%2==0,(x,y)=>((x+y)%2+x*y%3)%2==0];
    const apply=k=>{for(let y=0;y<size;y++)for(let x=0;x<size;x++)if(!fn[y][x]&&cond[k](x,y))m[y][x]=!m[y][x]};
    const penalty=()=>{
      let p=0;
      for(let y=0;y<size;y++){let run=1;for(let x=1;x<size;x++){if(m[y][x]==m[y][x-1]){run++;if(run==5)p+=3;else if(run>5)p++}else run=1}}
      for(let x=0;x<size;x++){let run=1;for(let y=1;y<size;y++){if(m[y][x]==m[y-1][x]){run++;if(run==5)p+=3;else if(run>5)p++}else run=1}}
      for(let y=0;y<size-1;y++)for(let x=0;x<size-1;x++){const c=m[y][x];if(c==m[y][x+1]&&c==m[y+1][x]&&c==m[y+1][x+1])p+=3}
      let dark=0;for(const r of m)for(const c of r)if(c)dark++;
      p+=Math.floor(Math.abs(dark*20-size*size*10)/(size*size))*10;
      return p;
    };
    let best=0,bp=1e9;
    for(let k=0;k<8;k++){apply(k);fmt(k);const p=penalty();if(p<bp){bp=p;best=k}apply(k)}
    apply(best);fmt(best);
    return m;
  }
  function draw(canvas,text,px){
    const m=encode(text),q=4,n=m.length+q*2,s=Math.max(1,Math.floor(px/n));
    canvas.width=canvas.height=n*s;
    const c=canvas.getContext("2d");c.fillStyle="#fff";c.fillRect(0,0,n*s,n*s);c.fillStyle="#000";
    m.forEach((row,y)=>row.forEach((v,x)=>{if(v)c.fillRect((x+q)*s,(y+q)*s,s,s)}));
  }
  return {encode,draw};
})();

/* ============ TEXTES ============ */
const T={
fr:{slogan:"Le lien professionnel, en un scan.",myCard:"Ma carte numérique",profile:"Mon profil",fName:"Nom complet",fTitle:"Poste / titre",fOrg:"Entreprise / organisation",fPhone:"Téléphone",fEmail:"E-mail",fWeb:"Site web / LinkedIn",fCity:"Ville",save:"Enregistrer mon profil",dlQR:"Télécharger le QR",dlVcf:"Fichier contact (.vcf)",share:"Partager",addContact:"Ajouter un contact",pasteLbl:"Coller une carte (texte vCard)",importBtn:"Importer",scanBtn:"Scanner (caméra)",note:"Note",addBtn:"Ajouter le contact",contacts:"Mes contacts",search:"Rechercher…",history:"Historique",settings:"Réglages",lang:"Langue",backup:"Sauvegarde",exportJson:"Exporter (JSON)",exportVcf:"Exporter contacts (.vcf)",restore:"Restaurer depuis un fichier JSON",wipe:"Tout effacer",offlineNote:"Toutes les données restent sur cet appareil (stockage local). Aucune connexion n'est nécessaire.",tCard:"Ma carte",tNet:"Réseau",tHist:"Historique",tSet:"Réglages",
 namePh:"Votre nom",saved:"Profil enregistré",added:"Contact ajouté",needName:"Le nom est obligatoire",noVcard:"Aucune carte reconnue",del:"Supprimer",call:"Appeler",mail:"E-mail",empty:"Aucun contact pour le moment.",emptyH:"Aucune activité pour le moment.",confirmDel:"Supprimer ce contact ?",confirmWipe:"Effacer TOUTES les données de Lynko sur cet appareil ?",wiped:"Données effacées",restored:"Données restaurées",badFile:"Fichier invalide",scanNo:"Le scan par caméra n'est pas pris en charge par ce navigateur. Scannez le QR avec l'appareil photo de votre téléphone, puis collez le texte ici.",scanOn:"Visez un QR code Lynko…",scanDone:"QR lu",noCam:"Caméra inaccessible",hCard:"Profil mis à jour",hAdd:"Contact ajouté : ",hDel:"Contact supprimé : ",hExp:"Export effectué",hImp:"Sauvegarde restaurée",noShare:"Partage indisponible : fichier téléchargé",mine:"Votre nom"},
en:{slogan:"The professional link, in one scan.",myCard:"My digital card",profile:"My profile",fName:"Full name",fTitle:"Job title",fOrg:"Company / organization",fPhone:"Phone",fEmail:"Email",fWeb:"Website / LinkedIn",fCity:"City",save:"Save my profile",dlQR:"Download QR",dlVcf:"Contact file (.vcf)",share:"Share",addContact:"Add a contact",pasteLbl:"Paste a card (vCard text)",importBtn:"Import",scanBtn:"Scan (camera)",note:"Note",addBtn:"Add contact",contacts:"My contacts",search:"Search…",history:"History",settings:"Settings",lang:"Language",backup:"Backup",exportJson:"Export (JSON)",exportVcf:"Export contacts (.vcf)",restore:"Restore from a JSON file",wipe:"Erase everything",offlineNote:"All data stays on this device (local storage). No connection is needed.",tCard:"My card",tNet:"Network",tHist:"History",tSet:"Settings",

};

/* ============ ETAT / STOCKAGE ============ */
const KEY="lynko_v1";
let S={lang:"fr",profile:{name:"",title:"",org:"",phone:"",email:"",web:"",city:""},contacts:[],history:[]};
try{const raw=localStorage.getItem(KEY);if(raw)S=Object.assign(S,JSON.parse(raw))}catch(e){}
function persist(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){toast("Stockage indisponible")}}
const t=k=>(T[S.lang]||T.fr)[k]||k;
function log(msg){S.history.unshift({d:Date.now(),m:msg});S.history=S.history.slice(0,200)}
const $=id=>document.getElementById(id);
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function toast(m){const e=$("toast");e.textContent=m;e.classList.add("show");clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove("show"),2200)}

/* ============ LANGUE / ONGLETS ============ */
function applyLang(){
  document.documentElement.lang=S.lang;
  document.querySelectorAll("[data-i]").forEach(e=>e.textContent=t(e.dataset.i));
  document.querySelectorAll("[data-ip]").forEach(e=>e.placeholder=t(e.dataset.ip));
  $("lang").value=S.lang;
  renderPreview();renderContacts();renderHistory();
}
function setLang(l){S.lang=l;persist();applyLang()}
function tab(n){
  document.querySelectorAll("section").forEach(s=>s.classList.toggle("on",s.id=="s-"+n));
  document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("on",b.dataset.t==n));
  if(n!="net")scanStop();
  window.scrollTo(0,0);
}

/* ============ VCARD ============ */
const vEsc=s=>String(s||"").replace(/\\/g,"\\\\").replace(/\n/g,"\\n").replace(/;/g,"\\;").replace(/,/g,"\\,");
function toVcf(c){
  const L=["BEGIN:VCARD","VERSION:3.0","FN:"+vEsc(c.name),"N:"+vEsc(c.name)+";;;;"];
  if(c.org)L.push("ORG:"+vEsc(c.org));
  if(c.title)L.push("TITLE:"+vEsc(c.title));
  if(c.phone)L.push("TEL;TYPE=CELL:"+vEsc(c.phone));
  if(c.email)L.push("EMAIL:"+vEsc(c.email));
  if(c.web)L.push("URL:"+vEsc(c.web));
  if(c.city)L.push("ADR;TYPE=WORK:;;;"+vEsc(c.city)+";;;");
  if(c.note)L.push("NOTE:"+vEsc(c.note));
  L.push("END:VCARD");return L.join("\r\n");
}
function unesc(s){return String(s||"").replace(/\\n/gi,"\n").replace(/\\([;,\\])/g,"$1")}
function parseVcf(text){
  const out=[],blocks=text.replace(/\r/g,"").replace(/\n[ \t]/g,"").split(/BEGIN:VCARD/i).slice(1);
  for(const b of blocks){
    const c={name:"",org:"",title:"",phone:"",email:"",web:"",city:"",note:""};
    for(const line of b.split("\n")){
      const i=line.indexOf(":");if(i<0)continue;
      const key=line.slice(0,i).split(";")[0].toUpperCase(),val=line.slice(i+1).trim();
      if(key=="FN")c.name=unesc(val);
      else if(key=="N"&&!c.name)c.name=unesc(val.split(";").filter(Boolean).reverse().join(" "));
      else if(key=="ORG")c.org=unesc(val.split(";")[0]);
      else if(key=="TITLE")c.title=unesc(val);
      else if(key=="TEL"&&!c.phone)c.phone=unesc(val);
      else if(key=="EMAIL"&&!c.email)c.email=unesc(val);
      else if(key=="URL"&&!c.web)c.web=unesc(val);
      else if(key=="ADR"&&!c.city)c.city=unesc(val.split(";")[3]||"");
      else if(key=="NOTE")c.note=unesc(val);
    }
    if(c.name)out.push(c);
  }
  return out;
}

/* ============ MA CARTE ============ */
function fillForm(){
  const p=S.profile;
  ["name","title","org","phone","email","web","city"].forEach(k=>$("f_"+k).value=p[k]||"");
}
function readForm(){
  const p={};["name","title","org","phone","email","web","city"].forEach(k=>p[k]=$("f_"+k).value.trim());
  return p;
}
function renderPreview(){
  const p=S.profile;
  $("pvName").textContent=p.name||t("mine");
  $("pvTitle").textContent=[p.title,p.org].filter(Boolean).join(" · ");
  $("pvLines").innerHTML=[p.phone,p.email,p.web,p.city].filter(Boolean).map(esc).join("<br>");
  try{
    QR.draw($("qr"),toVcf(p.name?p:{name:t("mine")}),220*(window.devicePixelRatio||1));
  }catch(e){toast(e.message)}
}
function saveProfile(){
  const p=readForm();
  if(!p.name){toast(t("needName"));return}
  S.profile=p;log(t("hCard"));persist();renderPreview();renderHistory();toast(t("saved"));
}
function download(name,blob){
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=name;
  document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),4000);
}
function downloadQR(){$("qr").toBlob(b=>download("lynko-qr.png",b))}
function downloadVcf(){
  if(!S.profile.name){toast(t("needName"));return}
  download("lynko-carte.vcf",new Blob([toVcf(S.profile)],{type:"text/vcard"}));
}
async function shareCard(){
  if(!S.profile.name){toast(t("needName"));return}
  const file=new File([toVcf(S.profile)],"lynko-carte.vcf",{type:"text/vcard"});
  try{
    if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:S.profile.name});return}
    if(navigator.share){await navigator.share({title:S.profile.name,text:toVcf(S.profile)});return}
  }catch(e){if(e.name=="AbortError")return}
  downloadVcf();toast(t("noShare"));
}

/* ============ CONTACTS ============ */
function addContacts(list){
  list.forEach(c=>{
    c.id=Date.now().toString(36)+Math.random().toString(36).slice(2,6);
    c.added=Date.now();S.contacts.unshift(c);log(t("hAdd")+c.name);
  });
  persist();renderContacts();renderHistory();
}
function importPaste(){
  const txt=$("paste").value;
  const list=parseVcf(txt);
  if(!list.length){toast(t("noVcard"));return}
  addContacts(list);$("paste").value="";toast(t("added")+" ("+list.length+")");
}
function addManual(){
  const c={name:$("c_name").value.trim(),org:$("c_org").value.trim(),phone:$("c_phone").value.trim(),email:$("c_email").value.trim(),note:$("c_note").value.trim(),title:"",web:"",city:""};
  if(!c.name){toast(t("needName"));return}
  addContacts([c]);["c_name","c_org","c_phone","c_email","c_note"].forEach(i=>$(i).value="");toast(t("added"));
}
function renderContacts(){
  const q=($("search").value||"").toLowerCase();
  const list=S.contacts.filter(c=>!q||[c.name,c.org,c.email,c.phone,c.note].join(" ").toLowerCase().includes(q));
  $("cnt").textContent=S.contacts.length;
  $("list").innerHTML=list.length?list.map(c=>`
    <div class="ct"><b>${esc(c.name)}</b>
      <small>${esc([c.title,c.org].filter(Boolean).join(" · "))}</small>
      <small>${esc([c.phone,c.email].filter(Boolean).join(" · "))}</small>
      ${c.note?`<small>📝 ${esc(c.note)}</small>`:""}
      <div class="acts">
        ${c.phone?`<button class="sec" onclick="location.href='tel:'+${JSON.stringify(c.phone).replace(/"/g,"&quot;")}">${t("call")}</button>`:""}
        ${c.email?`<button class="sec" onclick="location.href='mailto:'+${JSON.stringify(c.email).replace(/"/g,"&quot;")}">${t("mail")}</button>`:""}
        <button class="dng" onclick="delContact('${c.id}')">${t("del")}</button>
      </div></div>`).join(""):`<p class="msg">${t("empty")}</p>`;
}
function delContact(id){
  if(!confirm(t("confirmDel")))return;
  const c=S.contacts.find(x=>x.id==id);
  S.contacts=S.contacts.filter(x=>x.id!=id);
  if(c)log(t("hDel")+c.name);
  persist();renderContacts();renderHistory();
}

/* ============ HISTORIQUE ============ */
function renderHistory(){
  const loc=S.lang=="fr"?"fr-FR":"en-GB";
  $("histList").innerHTML=S.history.length?S.history.map(h=>`<div class="hist">${esc(new Date(h.d).toLocaleString(loc,{dateStyle:"short",timeStyle:"short"}))} — ${esc(h.m)}</div>`).join(""):`<p class="msg">${t("emptyH")}</p>`;
}

/* ============ SCAN CAMERA (si le navigateur le permet) ============ */
let stream=null,scanTimer=null;
async function scanStart(){
  const msg=$("scanMsg");
  if(!("BarcodeDetector" in window)||!navigator.mediaDevices){msg.textContent=t("scanNo");return}
  try{
    const det=new BarcodeDetector({formats:["qr_code"]});
    stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:"environment"}});
    const v=$("vid");v.srcObject=stream;v.style.display="block";await v.play();
    msg.textContent=t("scanOn");
    scanTimer=setInterval(async()=>{
      try{
        const r=await det.detect(v);
        if(r.length){
          const list=parseVcf(r[0].rawValue);
          scanStop();
          if(list.length){addContacts(list);toast(t("scanDone"))}else{$("paste").value=r[0].rawValue;msg.textContent=t("noVcard")}
        }
      }catch(e){}
    },400);
  }catch(e){msg.textContent=t("noCam")}
}
function scanStop(){
  clearInterval(scanTimer);scanTimer=null;
  if(stream){stream.getTracks().forEach(x=>x.stop());stream=null}
  const v=$("vid");if(v){v.style.display="none";v.srcObject=null}
}

/* ============ EXPORT / IMPORT / EFFACER ============ */
function exportJSON(){
  download("lynko-sauvegarde.json",new Blob([JSON.stringify(S,null,2)],{type:"application/json"}));
  log(t("hExp"));persist();renderHistory();
}
function exportAllVcf(){
  if(!S.contacts.length){toast(t("empty"));return}
  download("lynko-contacts.vcf",new Blob([S.contacts.map(toVcf).join("\r\n")],{type:"text/vcard"}));
  log(t("hExp"));persist();renderHistory();
}
function importJSON(inp){
  const f=inp.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=()=>{
    try{
      const d=JSON.parse(r.result);
      if(!d||!Array.isArray(d.contacts)||typeof d.profile!="object")throw 0;
      S=Object.assign({lang:"fr",history:[]},d);log(t("hImp"));persist();fillForm();applyLang();toast(t("restored"));
    }catch(e){toast(t("badFile"))}
    inp.value="";
  };
  r.readAsText(f);
}
function wipe(){
  if(!confirm(t("confirmWipe")))return;
  try{localStorage.removeItem(KEY)}catch(e){}
  S={lang:S.lang,profile:{name:"",title:"",org:"",phone:"",email:"",web:"",city:""},contacts:[],history:[]};
  fillForm();applyLang();toast(t("wiped"));
}

/* ============ DEMARRAGE ============ */
fillForm();applyLang();
</script>
